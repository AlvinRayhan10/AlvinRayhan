<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Section - Portfolio</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
      }

      .skills-section {
        padding: 120px 0;
        position: relative;
        overflow: hidden;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        border-radius: 25px;
      }

      .skill-card {
        height: 180px;
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        overflow: hidden;
        position: relative;
        border: none;
      }

      .skill-card:hover {
        transform: translateY(-20px) scale(1.05);
        box-shadow: 0 35px 80px rgba(0, 0, 0, 0.3) !important;
      }

      .skill-icon {
        font-size: 3.5rem;
        transition: all 0.5s ease;
        margin-bottom: 1.5rem;
      }

      .skill-card:hover .skill-icon {
        transform: scale(1.2) rotateY(360deg);
      }

      .skill-progress {
        height: 12px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 1rem;
      }

      .skill-progress-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 2s ease;
        position: relative;
        overflow: hidden;
      }

      .skill-progress-text {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-weight: 600;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.9);
      }

      .gradient-text {
        background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .tech-category {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 50px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .tech-category:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .shimmer-effect::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        animation: shimmer 2s infinite;
      }
    </style>
  </head>
  <body>
    <!-- Awal Navbar -->
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light fixed-top bg-light bg-opacity-90 shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4 gradient-text" href="#"> <i class="bi bi-person-circle me-2"></i>Alvin Rayhan </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link px-3" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="Experiance.html">Experience</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="achivment.html">Achivment</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Akhir Navbar -->

    <!-- Skills Section -->
    <section class="skills-section">
      <div class="container position-relative z-3">
        <!-- Header -->
        <div class="row justify-content-center text-center mb-5 p-5">
          <div class="col-lg-8">
            <div class="glass-card p-5 mb-5">
              <h1 class="display-4 fw-bold mb-4 gradient-text animate__animated animate__fadeInDown">
                <i class="fas fa-cogs me-4 text-white opacity-75"></i>
                Skills yang saya kuasai
              </h1>
              <p class="lead fs-4 text-white opacity-90 animate__animated animate__fadeInUp animate__delay-1s">Menguasai berbagai teknologi modern untuk membangun aplikasi web yang scalable dan performant</p>
            </div>
          </div>
        </div>

        <!-- Skills Grid -->
        <div class="row g-4" id="skillsGrid">
          <!-- Skills cards akan di-generate oleh JavaScript -->
        </div>

        <!-- Tech Categories -->
        <div class="row justify-content-center mt-5">
          <div class="col-lg-10">
            <div class="text-center mb-5">
              <h3 class="h2 fw-bold text-white mb-4 animate__animated animate__fadeInUp animate__delay-1s">Technology Categories</h3>
            </div>
            <div class="row g-3 justify-content-center" id="techCategories">
              <!-- Tech categories akan di-generate oleh JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Skills Data
      const skillsData = [
        {
          name: "React.js",
          icon: "fab fa-react",
          level: 60,
          color: "#61DAFB",
          category: "Frontend",
        },
        {
          name: "HTML",
          icon: "fa-brands fa-html5",
          level: 70,
          color: "#61DAFB",
          category: "Frontend",
        },
        {
          name: "CSS",
          icon: "fa-brands fa-css3-alt",
          level: 60,
          color: "#61DAFB",
          category: "Frontend",
        },
        {
          name: "MYSQL",
          icon: "fa-solid fa-database",
          level: 60,
          color: "#61DAFB",
          category: "Database",
        },
        {
          name: "JavaScript",
          icon: "fab fa-js-square",
          level: 60,
          color: "#F7DF1E",
          category: "Frontend",
        },
        {
          name: "Laravel",
          icon: "fa-brands fa-laravel",
          level: 50,
          color: "#000000",
          category: "Backend",
        },

        {
          name: "Tailwind CSS",
          icon: "fab fa-css3-alt",
          level: 60,
          color: "#38B2AC",
          category: "Styling",
        },
        {
          name: "Bootstrap 5",
          icon: "fab fa-bootstrap",
          level: 70,
          color: "#7952B3",
          category: "Styling",
        },
        {
          name: "Figma",
          icon: "fas fa-paint-brush",
          level: 60,
          color: "#F24E1E",
          category: "Design",
        },
        {
          name: "Git",
          icon: "fab fa-git-alt",
          level: 50,
          color: "#F05032",
          category: "Tools",
        },
        {
          name: "Microsoft Office",
          icon: "fa-brands fa-microsoft",
          level: 80,
          color: "#F05032",
          category: "Tools",
        },
      ];

      // Tech Categories Data
      const techCategories = [
        { name: "Frontend", icon: "fab fa-react", color: "primary", count: 4 },
        { name: "Backend", icon: "fa-brands fa-laravel", color: "success", count: 1 },
        { name: "Database", icon: "fas fa-database", color: "info", count: 1 },
        { name: "Styling", icon: "fab fa-css3-alt", color: "warning", count: 2 },
        { name: "Design", icon: "fas fa-paint-brush", color: "danger", count: 1 },
        { name: "Tools", icon: "fab fa-git-alt", color: "dark", count: 1 },
        { name: "Microsoft Office", icon: "fa-brands fa-microsoft", color: "dark", count: 1 },
      ];

      // Generate Skills Cards
      function generateSkills() {
        const skillsGrid = document.getElementById("skillsGrid");
        skillsData.forEach((skill, index) => {
          const skillCard = `
                    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
                        <div class="card skill-card glass-card h-100 text-white position-relative overflow-hidden animate__animated animate__zoomIn" 
                             style="animation-delay: ${index * 100}ms;">
                            <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                                <div class="skill-icon mb-3" style="color: ${skill.color};">
                                    <i class="${skill.icon}"></i>
                                </div>
                                <h4 class="card-title fw-bold mb-3 text-center">${skill.name}</h4>
                                <div class="w-100">
                                    <div class="skill-progress">
                                        <div class="skill-progress-fill" style="background: linear-gradient(90deg, ${skill.color}, rgba(255,255,255,0.5)); width: 0%;" data-target="${skill.level}">
                                            <span class="skill-progress-text">${skill.level}%</span>
                                        </div>
                                    </div>
                                    <small class="text-center d-block mt-2 opacity-75">${skill.category}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
          skillsGrid.innerHTML += skillCard;
        });
      }

      // Generate Tech Categories
      function generateTechCategories() {
        const techContainer = document.getElementById("techCategories");
        techCategories.forEach((category, index) => {
          const techCard = `
                    <div class="col-auto animate__animated animate__fadeInUp" style="animation-delay: ${index * 150}ms;">
                        <div class="tech-category text-white position-relative">
                            <i class="${category.icon} me-2" style="color: var(--bs-${category.color});"></i>
                            ${category.name}
                            <span class="badge bg-${category.color} ms-2">${category.count}</span>
                        </div>
                    </div>
                `;
          techContainer.innerHTML += techCard;
        });
      }

      // Animate Progress Bars
      function animateProgressBars() {
        const progressBars = document.querySelectorAll(".skill-progress-fill");

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                progressBars.forEach((bar) => {
                  const targetWidth = bar.getAttribute("data-target");
                  bar.style.width = targetWidth + "%";
                });
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.5 },
        );

        observer.observe(document.getElementById("skillsGrid"));
      }

      // Card Hover Effects
      function addHoverEffects() {
        document.querySelectorAll(".skill-card").forEach((card) => {
          card.addEventListener("mouseenter", function () {
            this.style.transform = "translateY(-20px) scale(1.05)";
          });

          card.addEventListener("mouseleave", function () {
            this.style.transform = "translateY(0) scale(1)";
          });
        });
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", function () {
        generateSkills();
        generateTechCategories();
        animateProgressBars();
        addHoverEffects();
      });

      // Smooth Scroll
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute("href"));
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    </script>
  </body>
</html>
